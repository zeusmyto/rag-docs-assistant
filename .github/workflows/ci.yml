name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - name: Quality gate on the sample documents
        run: |
          python -m rag --embedder hashing ingest sample_docs
          python -m rag --embedder hashing --llm extractive --min-score 0.1 \
            eval evals/handbook.jsonl --min-hit 0.9 --min-facts 0.8 --min-refusal 0.8
